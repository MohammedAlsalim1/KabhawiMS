version: '3.8'

services:

  discovery-server:
    build: ./Discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    restart: always

  gateway-server:
    build: ./GateWay-server
    container_name: gateway-server
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    restart: always

  product-db:
    image: postgres:16
    container_name: product-db
    restart: always
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-server:
    build: ./Product-server
    container_name: product-server
    ports:
      - "9090:9090"
    environment:
      - DB_URL=jdbc:postgresql://product-db:5432/products
      - DB_USER=postgres
      - DB_PASS=1234
      - EUREKA_URL=http://discovery-server:8761/eureka/
    depends_on:
      product-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    restart: always

  order-db:
    image: postgres:16
    container_name: order-db
    restart: always
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-server:
    build: ./Order-server
    container_name: order-server
    ports:
      - "9091:9091"
    environment:
      - DB_URL=jdbc:postgresql://order-db:5432/orders
      - DB_USER=postgres
      - DB_PASS=1234
      - EUREKA_URL=http://discovery-server:8761/eureka/
    depends_on:
      order-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
    restart: always