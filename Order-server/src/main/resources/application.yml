spring:
  application:
    name: order-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.hostinger.com
    port: 465
    username: info@alkabhawy-gallery.com
    password: "M7md@315050344" # 👈 التعديل الأول: وضع علامات تنصيص لحماية كلمة المرور

    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          # 👈 التعديل الثاني: إضافة إعدادات مصنع الاتصال الآمن بصيغة YAML
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

server:
  port: 9091