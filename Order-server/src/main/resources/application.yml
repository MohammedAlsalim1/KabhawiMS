spring:
  application:
    name: order-server

  datasource:
      url: ${DB_URL:jdbc:postgresql://order-db:5432/orders}
      username: ${DB_USER:postgres}
      password: ${DB_PASS:1234}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: 9091